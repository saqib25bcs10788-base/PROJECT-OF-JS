<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mini Quote Saver</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --bg: #FFF59D; 
      --card-bg: #FFFFFF;
      --primary: #4F46E5;
      --primary-hover: #4338CA;
      --accent: #10B981;
      --text: #111827;
      --muted-text: #6B7280;
      --danger: #EF4444;
      --danger-hover: #DC2626;
      --border: #D1D5DB;
      --shadow-soft: 0 10px 25px rgba(15, 23, 42, 0.1);
      --radius-card: 16px;
      --radius-input: 10px;
      --radius-pill: 999px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    main {
      width: 100%;
      max-width: 480px;
    }

    .app-card {
      background: var(--card-bg);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-soft);
      padding: 24px 20px;
    }

    @media (min-width: 768px) {
      .app-card {
        padding: 28px 24px;
      }
    }

    .app-header {
      margin-bottom: 20px;
    }

    .app-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .app-subtitle {
      font-size: 0.9rem;
      color: var(--muted-text);
    }

    .quote-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .quote-input {
      width: 100%;
      padding: 10px 12px;
      border-radius: var(--radius-input);
      border: 1px solid var(--border);
      outline: none;
      font-size: 0.95rem;
      color: var(--text);
      background: #f9fafb;
    }

    .quote-input::placeholder {
      color: var(--muted-text);
    }

    .quote-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
      background: #ffffff;
    }

    .actions-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      border-radius: var(--radius-pill);
      border: none;
      padding: 9px 18px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.18s ease, transform 0.12s ease,
        box-shadow 0.12s ease;
      box-shadow: 0 4px 10px rgba(79, 70, 229, 0.2);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(79, 70, 229, 0.3);
    }

    .btn-primary:active {
      transform: translateY(0);
      box-shadow: 0 3px 8px rgba(79, 70, 229, 0.25);
    }

    .status-message {
      font-size: 0.8rem;
      color: var(--muted-text);
      min-height: 1em;
    }

    .status-error {
      color: var(--danger);
    }

    .status-success {
      color: var(--accent);
    }

    .quotes-section {
      margin-top: 12px;
    }

    .quotes-header {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--muted-text);
      margin-bottom: 6px;
    }

    .quotes-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 260px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .quote-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      background: #f9fafb;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
    }

    .quote-text {
      font-size: 0.9rem;
      line-height: 1.4;
      color: var(--text);
      word-break: break-word;
      flex: 1;
    }

    .btn-delete {
      background: transparent;
      border: none;
      color: var(--danger);
      font-size: 0.8rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: var(--radius-pill);
      transition: background 0.15s ease, color 0.15s ease;
      white-space: nowrap;
    }

    .btn-delete:hover {
      background: rgba(248, 113, 113, 0.12);
      color: var(--danger-hover);
    }

    .empty-state {
      font-size: 0.85rem;
      color: var(--muted-text);
      padding: 10px 4px 0;
    }
  </style>
</head>
<body>
  <main>
    <section class="app-card" aria-label="Mini Quote Saver app">
      <header class="app-header">
        <h1 class="app-title">Mini Quote Saver</h1>
        <p class="app-subtitle">
          Save your favorite lines, thoughts, or one-liners. They’ll stay here
          even after you refresh.
        </p>
      </header>

      <form class="quote-form" id="quoteForm">
        <input
          type="text"
          id="quoteInput"
          class="quote-input"
          placeholder="Type a quote you want to remember..."
          aria-label="Quote text"
        />

        <div class="actions-row">
          <button type="submit" class="btn-primary" id="addQuoteButton">
            ➕ Add Quote
          </button>
          <span class="status-message" id="statusMessage"></span>
        </div>
      </form>

      <section class="quotes-section" aria-label="Saved quotes">
        <div class="quotes-header">Saved Quotes</div>
        <ul class="quotes-list" id="quoteList"></ul>
        <p class="empty-state" id="emptyState">
          No quotes yet. Add your first one above!
        </p>
      </section>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "miniQuoteSaverQuotes";
    const quotes = [];

    const quoteForm = document.getElementById("quoteForm");
    const quoteInput = document.getElementById("quoteInput");
    const statusMessage = document.getElementById("statusMessage");
    const quoteList = document.getElementById("quoteList");
    const emptyState = document.getElementById("emptyState");

    function saveQuotes() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(quotes));
    }

    function loadQuotes() {
      const stored = localStorage.getItem(STORAGE_KEY);

      if (!stored) {
        renderQuotes();
        return;
      }

      try {
        const parsed = JSON.parse(stored);

        if (Array.isArray(parsed)) {
          quotes.length = 0;
          parsed.forEach((q) => quotes.push(q));
        }
      } catch (err) {
        console.error("Failed to parse stored quotes:", err);
      }

      renderQuotes();
    }

    function renderQuotes() {
      while (quoteList.firstChild) {
        quoteList.removeChild(quoteList.firstChild);
      }

      if (quotes.length === 0) {
        emptyState.style.display = "block";
      } else {
        emptyState.style.display = "none";
      }

      quotes.forEach((quote, index) => {
        const li = document.createElement("li");
        li.className = "quote-item";

        const span = document.createElement("span");
        span.className = "quote-text";
        span.textContent = quote;

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "btn-delete";
        deleteBtn.type = "button";
        deleteBtn.textContent = "Delete";
        deleteBtn.addEventListener("click", () => {
          deleteQuote(index);
        });

        li.appendChild(span);
        li.appendChild(deleteBtn);
        quoteList.appendChild(li);
      });
    }

    function addQuote() {
      const value = quoteInput.value.trim();

      statusMessage.textContent = "";
      statusMessage.className = "status-message";

      if (!value) {
        statusMessage.textContent = "Please type a quote before adding.";
        statusMessage.classList.add("status-error");
        return;
      }

      quotes.push(value);
      saveQuotes();
      renderQuotes();

      quoteInput.value = "";
      statusMessage.textContent = "Quote added!";
      statusMessage.classList.add("status-success");
    }

    function deleteQuote(index) {
      quotes.splice(index, 1);
      saveQuotes();
      renderQuotes();

      statusMessage.textContent = "Quote deleted.";
      statusMessage.className = "status-message status-success";
    }

    quoteForm.addEventListener("submit", function (event) {
      event.preventDefault();
      addQuote();
    });

    loadQuotes();
  </script>
</body>
</html>
